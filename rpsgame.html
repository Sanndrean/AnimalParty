<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>
        Rock Paper Scissors
    </title>

    <link
        rel="stylesheet"
        href="rpsgame.css"
    >

</head>


<body>
<script src="audio.js"></script>
<script src="index.js"></script>

    <!-- BACKGROUND -->

    <div class="rps-world">

        <div class="arena-glow"></div>

        <div class="decor d1">
            ✊
        </div>

        <div class="decor d2">
            ✋🏼
        </div>

        <div class="decor d3">
            ✌🏼
        </div>

    </div>



    <!-- HUD -->

    <header class="hud">


        <div class="hud-player">

            <span id="playerIcon">
                🐶
            </span>

            <div>

                <small>
                    PLAYER
                </small>

                <strong id="playerName">
                    Maximus
                </strong>

            </div>

        </div>



        <div class="round-box">

            <small>
                ROUND
            </small>

            <strong id="roundText">
                1
            </strong>

        </div>



        <div
            class="timer-box"
            id="timerBox"
        >

            <small>
                TIME
            </small>

            <strong id="timerText">
                10
            </strong>

        </div>


    </header>



    <!-- SCORE -->

    <div class="score-board">

        <div>

            YOU

            <strong id="playerScore">
                0
            </strong>

        </div>


        <span>
            VS
        </span>


        <div>

            MR.T

            <strong id="enemyScore">
                0
            </strong>

        </div>

    </div>



    <!-- ARENA -->

    <main class="arena">


        <!-- PLAYER -->

        <section class="fighter-side">


            <div
                class="fighter-icon"
                id="fighterIcon"
            >
                🐶
            </div>


            <div class="fighter-name">
                YOU
            </div>


            <div
                class="choice-display"
                id="playerChoiceDisplay"
            >
                ❔
            </div>


        </section>



        <!-- VS -->

        <section class="center-zone">


            <div
                class="battle-text"
                id="battleText"
            >
                CHOOSE!
            </div>


            <div class="vs-circle">
                VS
            </div>


        </section>



        <!-- MR T -->

        <section class="fighter-side">


            <div class="fighter-icon">
                🐯
            </div>


            <div class="fighter-name enemy-name">
                MR.T
            </div>


            <div
                class="choice-display"
                id="enemyChoiceDisplay"
            >
                ❔
            </div>


        </section>


    </main>



    <!-- CHOICES -->

    <section class="choice-buttons">


        <button
            type="button"
            class="choice-button"
            data-choice="paper"
        >

            <span>
                ✋🏼
            </span>

            <small>
                PAPER
            </small>

        </button>



        <button
            type="button"
            class="choice-button"
            data-choice="scissors"
        >

            <span>
                ✌🏼
            </span>

            <small>
                SCISSORS
            </small>

        </button>



        <button
            type="button"
            class="choice-button"
            data-choice="rock"
        >

            <span>
                ✊🏼
            </span>

            <small>
                ROCK
            </small>

        </button>


    </section>



    <!-- INSTRUCTION -->

    <div
        class="overlay show"
        id="instructionOverlay"
    >

        <div class="popup instruction-popup">

            <div class="popup-icon">
                🐯✊
            </div>

            <div class="difficulty">
                🟡 BEGINNER ⭐⭐
            </div>

            <h1>
                ROCK PAPER SCISSORS
            </h1>

            <div class="instruction-line">
                ✋🏼 ✌🏼 ✊🏼 Pilih sebelum 10 detik habis.
            </div>

            <div class="instruction-line">
                🏆 Menang minimal 2 ronde untuk menang match.
            </div>

            <button
                type="button"
                class="main-button"
                id="readyButton"
            >
                READY!
            </button>

        </div>

    </div>



    <!-- COUNTDOWN -->

    <div
        class="overlay"
        id="countdownOverlay"
    >

        <div
            class="countdown"
            id="countdown"
        >
            3
        </div>

    </div>



    <!-- ROUND RESULT -->

    <div
        class="round-result"
        id="roundResult"
    >

        <small>
            ROUND RESULT
        </small>

        <h1 id="roundResultText">
            YOU WON!
        </h1>

    </div>



    <!-- WIN -->

    <div
        class="overlay"
        id="winOverlay"
    >

        <div class="popup win-popup">

            <div class="result-icon">
                🏆
            </div>

            <h1>
                YOU WON!
            </h1>

            <div class="reward">
                ⭐ +1 STAR
            </div>

            <button
                type="button"
                class="main-button"
                id="winButton"
            >
                CONTINUE
            </button>

        </div>

    </div>



    <!-- LOSE -->

    <div
        class="overlay"
        id="loseOverlay"
    >

        <div class="popup lose-popup">

            <div class="result-icon">
                🐯
            </div>

            <h1>
                YOU LOST!
            </h1>

            <button
                type="button"
                class="main-button"
                id="loseButton"
            >
                BACK TO HOME
            </button>

        </div>

    </div>



    <script src="rpsgame.js"></script>


</body>

</html>
