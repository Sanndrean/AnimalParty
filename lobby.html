<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Animal Party - Lobby</title>

    <link
        rel="stylesheet"
        href="lobby.css"
    >

</head>


<body>


<!-- =========================================================
     BACKGROUND
========================================================= -->

<div class="lobby-background"></div>

<div class="background-shade"></div>



<!-- =========================================================
     PROFILE
========================================================= -->

<section class="profile-panel">

    <div
        class="profile-avatar"
        id="profileIcon"
    >
        🐶
    </div>


    <div class="profile-main">

        <div class="profile-name-row">

            <strong id="profileName">
                Maximus
            </strong>


            <button
                type="button"
                class="edit-name-button"
                id="editNameButton"
                title="Edit Name"
            >
                ✎
            </button>

        </div>


        <div class="profile-level-row">

            <strong id="profileLevel">
                LV. 1
            </strong>


            <div class="xp-bar">

                <div
                    class="xp-fill"
                    id="levelFill"
                ></div>

            </div>


            <small id="xpText">
                0 / 100
            </small>

        </div>

    </div>

</section>



<!-- =========================================================
     CURRENCY
========================================================= -->

<section class="currency-panel">

    <div class="currency-item">

        <span>⭐</span>

        <strong id="starCurrency">
            0
        </strong>

    </div>


    <div class="currency-item">

        <span>🪙</span>

        <strong id="coinCurrency">
            0
        </strong>

    </div>


    <div class="currency-item">

        <span>💎</span>

        <strong id="diamondCurrency">
            0
        </strong>

    </div>

</section>



<!-- =========================================================
     TOP RIGHT
========================================================= -->

<div class="top-right">

    <button
        type="button"
        id="calendarButton"
        title="Updates"
    >
        📅
    </button>


    <button
        type="button"
        id="friendsTopButton"
        title="Friends"
    >
        👥
    </button>


    <button
        type="button"
        id="suggestionButton"
        title="Suggestions"
    >
        ✉️
    </button>


    <button
        type="button"
        id="settingsButton"
        title="Settings"
    >
        ⚙️
    </button>

</div>



<!-- =========================================================
     LEFT MENU
========================================================= -->

<nav class="side-menu">


    <button
        type="button"
        class="side-button active"
        id="lobbyButton"
    >

        <span>
            🏰
        </span>

        <div>

            <strong>
                LOBBY
            </strong>

            <small>
                PARTY HOUSE
            </small>

        </div>

    </button>



    <button
        type="button"
        class="side-button"
        id="dailyButton"
    >

        <span>
            🎁
        </span>

        <div>

            <strong>
                DAILY
            </strong>

            <small>
                REWARDS
            </small>

        </div>

        <b class="notification-dot"></b>

    </button>



    <button
        type="button"
        class="side-button"
        id="shopButton"
    >

        <span>
            🛍️
        </span>

        <div>

            <strong>
                SHOP
            </strong>

            <small>
                ACCESSORIES
            </small>

        </div>

    </button>



    <button
        type="button"
        class="side-button"
        id="inventoryButton"
    >

        <span>
            🎒
        </span>

        <div>

            <strong>
                INVENTORY
            </strong>

            <small>
                YOUR ITEMS
            </small>

        </div>

    </button>



    <button
        type="button"
        class="side-button"
        id="badgesButton"
    >

        <span>
            🏆
        </span>

        <div>

            <strong>
                BADGES
            </strong>

            <small>
                ACHIEVEMENTS
            </small>

        </div>

    </button>



    <button
        type="button"
        class="side-button"
        id="friendsButton"
    >

        <span>
            👥
        </span>

        <div>

            <strong>
                FRIENDS
            </strong>

            <small>
                COMING SOON
            </small>

        </div>

    </button>

</nav>



<!-- =========================================================
     CHARACTER
========================================================= -->

<main class="character-stage">

    <div class="character-glow"></div>


    <div
        class="character-accessory"
        id="characterAccessory"
    ></div>


    <div
        class="lobby-character"
        id="lobbyCharacter"
    >
        🐶
    </div>


    <div class="character-shadow"></div>

</main>



<!-- =========================================================
     CHOOSE MODE
========================================================= -->

<aside class="mode-panel">

    <div class="panel-decoration">
        ✦
    </div>


    <header class="mode-header">

        <small>
            ✦ PARTY HOUSE ✦
        </small>

        <h1>
            CHOOSE MODE
        </h1>

    </header>


    <div class="ornament">

        <span></span>

        🐾

        <span></span>

    </div>



    <!-- MINIGAMES -->

    <button
        type="button"
        class="mode-card minigames-card"
        id="minigamesButton"
    >

        <div class="mode-icon">
            🎯
        </div>


        <div class="mode-info">

            <small>
                CLASSIC
            </small>

            <strong>
                MINIGAMES
            </strong>

        </div>


        <div class="mode-arrow">
            ❯
        </div>

    </button>



    <!-- TYCOON -->

    <button
        type="button"
        class="mode-card tycoon-card"
        id="tycoonButton"
    >

        <div class="new-badge">
            NEW
        </div>


        <div class="mode-icon">
            🏰
        </div>


        <div class="mode-info">

            <small>
                LIFE MODE
            </small>

            <strong>
                TYCOON
            </strong>

        </div>


        <div class="mode-arrow">
            ❯
        </div>

    </button>


    <footer class="mode-footer">
        ✨ Pick your next adventure! ✨
    </footer>

</aside>



<!-- =========================================================
     QUICK BUTTONS
     KEEP FOR JS — HIDDEN ON DESKTOP BY CSS
========================================================= -->

<section class="bottom-widgets">


    <button
        type="button"
        class="bottom-widget"
        id="dailyQuickButton"
    >
        🎁 DAILY
    </button>


    <button
        type="button"
        class="bottom-widget"
        id="badgesQuickButton"
    >
        🏆 BADGES
    </button>


    <button
        type="button"
        class="bottom-widget"
        id="shopQuickButton"
    >
        🛍️ SHOP
    </button>


    <button
        type="button"
        class="bottom-widget"
        id="friendsQuickButton"
    >
        👥 FRIENDS
    </button>

</section>



<!-- =========================================================
     GENERAL MODAL
========================================================= -->

<div
    class="modal-overlay"
    id="modalOverlay"
>

    <section class="modal">

        <button
            type="button"
            class="modal-close"
            id="modalClose"
        >
            ✕
        </button>


        <div
            class="modal-icon"
            id="modalIcon"
        >
            🎁
        </div>


        <small
            class="modal-label"
            id="modalLabel"
        >
            ANIMAL PARTY
        </small>


        <h1 id="modalTitle">
            ANIMAL PARTY
        </h1>


        <div
            class="modal-content"
            id="modalContent"
        ></div>

    </section>

</div>



<!-- =========================================================
     EDIT NAME MODAL
========================================================= -->

<div
    class="modal-overlay"
    id="nameModal"
>

    <section class="modal name-modal-card">

        <button
            type="button"
            class="modal-close"
            id="closeNameModal"
        >
            ✕
        </button>


        <div class="modal-icon">
            ✏️
        </div>


        <small class="modal-label">
            PLAYER PROFILE
        </small>


        <h1>
            EDIT NAME
        </h1>


        <p class="name-description">
            Choose the name shown in your Animal Party lobby.
        </p>


        <input
            type="text"
            id="nameInput"
            class="name-input"
            maxlength="16"
            autocomplete="off"
            placeholder="Enter your name"
        >


        <button
            type="button"
            class="save-name-button"
            id="saveNameButton"
        >
            SAVE NAME
        </button>

    </section>

</div>



<!-- =========================================================
     XP POPUP
========================================================= -->

<div
    class="xp-popup"
    id="xpPopup"
>

    <span>
        ✨
    </span>

    <strong id="xpPopupText">
        +25 XP
    </strong>

</div>



<!-- =========================================================
     MODE TRANSITION
========================================================= -->

<div
    class="mode-transition"
    id="modeTransition"
>

    <div class="transition-decoration">
        ✦ 🐾 ✦
    </div>


    <div
        class="transition-icon"
        id="transitionIcon"
    >
        🎯
    </div>


    <small>
        ENTERING
    </small>


    <h1 id="transitionTitle">
        MINIGAMES
    </h1>


    <p>
        Getting your adventure ready...
    </p>


    <div class="transition-bar">
        <div></div>
    </div>

</div>



<!-- =========================================================
     SCRIPTS
========================================================= -->

<script src="audio.js"></script>


<script
    type="module"
    src="firebase.js"
></script>


<script src="lobby.js"></script>


</body>

</html>
