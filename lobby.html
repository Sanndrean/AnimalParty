<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Animal Party - Lobby</title>

    <link
        rel="stylesheet"
        href="lobby.css"
    >
</head>


<body>
<!-- AUDIO -->
<script src="audio.js?v=3"></script>
    <!-- BACKGROUND -->
    <div class="lobby-background"></div>
    <div class="background-overlay"></div>


    <!-- =====================================================
         PROFILE
    ====================================================== -->

    <section class="profile-panel">

        <div
            class="profile-avatar"
            id="profileIcon"
        >
            🐨
        </div>

        <div class="profile-content">

            <div class="profile-name-row">

                <strong id="profileName">
                    Player
                </strong>

                <button
                    class="edit-name-button"
                    id="editNameButton"
                    type="button"
                >
                    ✎
                </button>

            </div>


            <div class="level-row">

                <span id="profileLevel">
                    LV. 1
                </span>

                <div class="xp-bar">
                    <div
                        class="xp-fill"
                        id="levelFill"
                    ></div>
                </div>

                <small id="xpText">
                    0 / 100
                </small>

            </div>

        </div>

    </section>


    <!-- =====================================================
         CURRENCY
    ====================================================== -->

    <section class="currency-panel">

        <div class="currency-item">
            <span>⭐</span>
            <strong id="starCurrency">0</strong>
        </div>

        <div class="currency-item">
            <span>🪙</span>
            <strong id="coinCurrency">0</strong>
        </div>

        <div class="currency-item">
            <span>💎</span>
            <strong id="diamondCurrency">0</strong>
        </div>

    </section>


    <!-- =====================================================
         TOP RIGHT
    ====================================================== -->

    <div class="top-right">

        <button
            id="calendarButton"
            type="button"
            title="Updates"
        >
            📅
        </button>

        <button
            id="friendsTopButton"
            type="button"
            title="Friends"
        >
            👥
        </button>

        <button
            id="suggestionButton"
            type="button"
            title="Suggestions"
        >
            ✉️
        </button>

        <button
            id="settingsButton"
            type="button"
            title="Settings"
        >
            ⚙️
        </button>

    </div>


    <!-- =====================================================
         LEFT MENU
    ====================================================== -->

    <nav class="side-menu">

        <button
            class="side-button active"
            id="lobbyButton"
            type="button"
        >
            <span>🏰</span>

            <div>
                <strong>LOBBY</strong>
                <small>HOME</small>
            </div>
        </button>


        <button
            class="side-button"
            id="dailyButton"
            type="button"
        >
            <span>🎁</span>

            <div>
                <strong>DAILY</strong>
                <small>REWARDS</small>
            </div>

            <b class="notification-dot"></b>
        </button>


        <button
            class="side-button"
            id="shopButton"
            type="button"
        >
            <span>🛍️</span>

            <div>
                <strong>SHOP</strong>
                <small>ITEMS</small>
            </div>
        </button>


        <button
            class="side-button"
            id="inventoryButton"
            type="button"
        >
            <span>🎒</span>

            <div>
                <strong>INVENTORY</strong>
                <small>YOUR ITEMS</small>
            </div>
        </button>


        <button
            class="side-button"
            id="badgesButton"
            type="button"
        >
            <span>🏆</span>

            <div>
                <strong>BADGES</strong>
                <small>ACHIEVEMENTS</small>
            </div>
        </button>


        <button
            class="side-button"
            id="friendsButton"
            type="button"
        >
            <span>👥</span>

            <div>
                <strong>FRIENDS</strong>
                <small>COMING SOON</small>
            </div>
        </button>

    </nav>


    <!-- =====================================================
         CHARACTER
    ====================================================== -->

    <main class="character-stage">

        <div class="character-glow"></div>

        <div
            class="character-accessory"
            id="characterAccessory"
        ></div>

        <div
            class="lobby-character"
            id="lobbyCharacter"
        >
            🐨
        </div>

        <div class="character-shadow"></div>

    </main>


    <!-- =====================================================
         CHOOSE MODE
    ====================================================== -->

    <aside class="mode-panel">

        <div class="panel-sparkle">
            ✦
        </div>

        <header class="mode-header">

            <small>
                ✦ PARTY HOUSE ✦
            </small>

            <h1>
                CHOOSE MODE
            </h1>

        </header>


        <div class="mode-divider">

            <span></span>

            🐾

            <span></span>

        </div>


        <!-- MINIGAMES -->

        <button
            class="mode-card minigames-card"
            id="minigamesButton"
            type="button"
        >

            <div class="mode-icon">
                🎯
            </div>

            <div class="mode-info">

                <small>
                    CLASSIC
                </small>

                <strong>
                    MINIGAMES
                </strong>

            </div>

            <div class="mode-arrow">
                ❯
            </div>

        </button>


      <!-- MARIO WORLD -->

<button
    type="button"
    class="mode-card mario-world-card"
    id="marioWorldButton"
>

    <div class="new-badge">
        NEW
    </div>


    <div class="mode-icon mario-world-icon">

        <img
            src="./MarioFace.png"
            alt="Mario"
        >

    </div>


    <div class="mode-info">

        <small>
            ADVENTURE MODE
        </small>

        <strong>
            MARIO WORLD
        </strong>

    </div>


    <div class="mode-arrow">
        ❯
    </div>

</button>


    <!-- =====================================================
         GENERAL MODAL
    ====================================================== -->

    <div
        class="modal-overlay"
        id="modalOverlay"
    >

        <section class="modal">

            <button
                class="modal-close"
                id="modalClose"
                type="button"
            >
                ✕
            </button>

            <div
                class="modal-icon"
                id="modalIcon"
            >
                🎁
            </div>

            <small
                class="modal-label"
                id="modalLabel"
            >
                ANIMAL PARTY
            </small>

            <h1 id="modalTitle">
                ANIMAL PARTY
            </h1>

            <div
                class="modal-content"
                id="modalContent"
            ></div>

        </section>

    </div>


    <!-- =====================================================
         EDIT NAME
    ====================================================== -->

    <div
        class="modal-overlay"
        id="nameModal"
    >

        <section class="modal name-modal">

            <button
                class="modal-close"
                id="closeNameModal"
                type="button"
            >
                ✕
            </button>

            <div class="modal-icon">
                ✏️
            </div>

            <small class="modal-label">
                PLAYER PROFILE
            </small>

            <h1>
                EDIT NAME
            </h1>

            <p>
                Choose the name shown in your Animal Party lobby.
            </p>

            <input
                id="nameInput"
                class="name-input"
                maxlength="16"
                placeholder="Enter your name"
                autocomplete="off"
            >

            <button
                id="saveNameButton"
                class="primary-button"
                type="button"
            >
                SAVE NAME
            </button>

        </section>

    </div>


    <!-- =====================================================
         XP POPUP
    ====================================================== -->

    <div
        class="xp-popup"
        id="xpPopup"
    >
        ✨
        <strong id="xpPopupText">
            +25 XP
        </strong>
    </div>


    <!-- =====================================================
         LOADING SCREEN
    ====================================================== -->

    <div
        class="mode-transition"
        id="modeTransition"
    >

        <div
            class="transition-icon"
            id="transitionIcon"
        >
            🎯
        </div>

        <small>
            ENTERING
        </small>

        <h1 id="transitionTitle">
            MINIGAMES
        </h1>

        <div class="transition-bar">
            <div></div>
        </div>

        <p>
            Getting your adventure ready...
        </p>

    </div>


    <!-- FIREBASE -->
    <script
        type="module"
        src="firebase.js"
    ></script>

    <!-- LOBBY -->
    <script src="lobby.js"></script>

</body>

</html>
